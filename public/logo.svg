<?xml version="1.0" encoding="UTF-8"?>
<!--
  LOGO E NISU TRAVEL (rindërtim vendmbajtës)
  Wordmark i bardhë në një rresht, me aeroplan mbi shkronjën N.
  Zëvendësojeni me skedarin origjinal duke ruajtur emrin /public/logo.svg
  dhe raportin 4:1. Logoja duhet të mbetet E BARDHË, sepse shfaqet mbi
  sfond të gjelbër ose mbi fotografi të errësuara.

  Teksti përdor textLength, prandaj mbetet brenda kornizës edhe nëse fonti
  Bebas Neue nuk është i disponueshëm dhe përdoret një zëvendësues.
  Shënim: brenda komenteve të SVG-së nuk lejohen dy viza radhazi.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110" role="img" aria-label="Nisu Travel">
  <title>Nisu Travel</title>
  <g fill="#FFFFFF">
    <!-- Gjurma e fluturimit, mbi wordmark -->
    <path d="M120 14 C152 4 188 6 214 18"
          stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- Aeroplani që prek majën e shkronjës N -->
    <g transform="translate(64,26) rotate(-26) scale(0.5)">
      <path d="M112 0 L96 7 L58 10 L30 27 L17 27 L34 10 L14 11 L4 21 L-5 21 L1 8
               L-12 0 L1 -8 L-5 -21 L4 -21 L14 -11 L34 -10 L17 -27 L30 -27 L58 -10 L96 -7 Z"/>
    </g>

    <!-- Wordmark në një rresht -->
    <text x="20" y="98" textLength="400" lengthAdjust="spacingAndGlyphs"
          font-family="'Bebas Neue', 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif"
          font-size="76" font-weight="700">NISU TRAVEL</text>
  </g>
</svg>
